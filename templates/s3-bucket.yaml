AWSTemplateFormatVersion: 2010-09-09

Description: >-
  This S3 bucket will be used for development and production,
  and for storing partly or fully processed data

Parameters:

  BucketName:
    Type: String
    Description: Name of the bucket.
    Default: ''

  ConnectToSynapse:
    Type: String
    Description: Whether to grant Synapse read/write permissions on the bucket.
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  EnableExternalTransfer:
    Type: String
    Description: Whether to grant an external IAM role read permissions for cross-account aws s3 sync (source bucket).
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  ExternalTransferRoleArn:
    Type: String
    Description: IAM Role ARN (preferred) or IAM User ARN of the external principal that will read from this bucket.
    Default: ""

  ExternalTransferPrefix:
    Type: String
    Description: Optional prefix (folder) to restrict external reads (e.g., "exports/"). Leave blank to allow entire bucket.
    Default: ""

Conditions:
  HasBucketName: !Not [!Equals [!Ref BucketName, ""]]
  ConnectToSynapse:
    !Equals [!Ref ConnectToSynapse, "true"]
  EnableExternalTransfer:
    !Equals [!Ref EnableExternalTransfer, "true"]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasBucketName, !Ref BucketName, !Ref 'AWS::NoValue']
      AccessControl: Private
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls : true
        BlockPublicPolicy : true
        IgnorePublicAcls : true
        RestrictPublicBuckets : true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountRead
            Effect: Allow
            Principal:
              AWS:
                - !Sub '${AWS::AccountId}'
                - 'arn:aws:sts::526515999252:assumed-role/AWSReservedSSO_S3ExternalCollab_40c062f682e7f3f5/phil.snyder@sagebase.org'
                - 'arn:aws:sts::526515999252:assumed-role/AWSReservedSSO_S3ExternalCollab_40c062f682e7f3f5/rixing.xu@sagebase.org'
            Action:
              - 's3:Get*'
              - 's3:List*'
            Resource:
              - !Sub 'arn:aws:s3:::${Bucket}'
              - !Sub 'arn:aws:s3:::${Bucket}/*'
          # Deny HTTP requests
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub 'arn:aws:s3:::${Bucket}'
              - !Sub 'arn:aws:s3:::${Bucket}/*'
            Condition:
              Bool:
                aws:SecureTransport: "false"
          # Optional external transfer read access (for aws s3 sync as SOURCE)
          - !If
            - EnableExternalTransfer
            - Sid: ExternalTransferRead
              Effect: Allow
              Principal:
                AWS: !Ref ExternalTransferRoleArn
              Action:
                - "s3:ListBucket"
                - "s3:GetObject"
              Resource:
                - !Sub 'arn:aws:s3:::${Bucket}'
                - !Sub "arn:aws:s3:::${Bucket}/${ExternalTransferPrefix}*"
              Condition:
                StringLike:
                  s3:prefix:
                    - !Sub "${ExternalTransferPrefix}*"
                    - !Ref ExternalTransferPrefix
            - !Ref AWS::NoValue
          - !If
            - ConnectToSynapse
            - Sid: SynapseBucketAccess
              Effect: Allow
              Principal:
                AWS: '325565585839'
              Action:
                - 's3:ListBucket*'
                - 's3:GetBucketLocation'
              Resource: !Sub ${Bucket.Arn}
            - !Ref AWS::NoValue
          - !If
            - ConnectToSynapse
            - Sid: SynapseObjectAccess
              Effect: Allow
              Principal:
                AWS: '325565585839'
              Action:
                - 's3:*Object*'
                - 's3:*MultipartUpload*'
              Resource: !Sub ${Bucket.Arn}/*
            - !Ref AWS::NoValue
          - !If
            - ConnectToSynapse
            - Sid: RestrictAccessByRegion
              Effect: Deny
              NotAction:
                - 'iam:*'
                - 'support:*'
              Principal: '*'
              Resource: !Sub ${Bucket.Arn}/*
              Condition:
                StringNotEquals:
                  aws:RequestedRegion: 'us-east-1'
            - !Ref AWS::NoValue

Outputs:

  BucketName:
    Value: !Ref Bucket
    Export:
      Name: !Sub '${AWS::Region}-${AWS::StackName}-BucketName'

  BucketArn:
    Value: !GetAtt Bucket.Arn
    Export:
      Name: !Sub '${AWS::Region}-${AWS::StackName}-BucketArn'
